<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Dzeble</title>

  <base href="/" />

  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#121514" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" type="image/png" href="assets/icon/favicon.png" />

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />

  <style>
    html, body {
      background-color: #121514 !important;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* Isolated Full-screen Splash Surface */
    #dzeble-splash-root {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100vw;
      height: 100vh;
      background-color: #121514;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999999;
      transition: opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1), transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
      padding: max(20px, env(safe-area-inset-top)) 24px max(20px, env(safe-area-inset-bottom)) 24px;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      cursor: pointer;
      will-change: opacity, transform;
      contain: strict;
    }

    #dzeble-splash-root.fade-out {
      opacity: 0;
      transform: scale(1.02);
      pointer-events: none;
    }

    /* 60/120 FPS GPU Composited Stage */
    .splash-stage {
      position: relative;
      width: 154px;
      height: 231.6px;
      transform: translateZ(0);
    }

    /* 0. Ambient Emerald Glow (GPU Texture Quad, NO CPU Gaussian blur!) */
    .stage-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 230px;
      height: 270px;
      transform: translate3d(-50%, -50%, 0);
      background: radial-gradient(ellipse at center, rgba(16, 185, 129, 0.45) 0%, rgba(16, 185, 129, 0.08) 55%, transparent 75%);
      pointer-events: none;
      z-index: 0;
      will-change: opacity;
      animation: glowFadeIn 1.2s ease-out forwards;
    }

    @keyframes glowFadeIn {
      0% {
        opacity: 0;
        transform: translate3d(-50%, -50%, 0) scale(0.85);
      }
      100% {
        opacity: 1;
        transform: translate3d(-50%, -50%, 0) scale(1);
      }
    }

    /* 1. GPU Layer 1: Phone (Slides down into pocket smoothly) */
    .layer-phone {
      position: absolute;
      inset: 0;
      z-index: 1;
      will-change: transform, opacity;
      transform: translate3d(0, -90px, 0);
      animation: phoneSlide 0.95s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes phoneSlide {
      0% {
        transform: translate3d(0, -90px, 0);
        opacity: 0;
      }
      30% {
        opacity: 1;
      }
      100% {
        transform: translate3d(0, 0, 0);
        opacity: 1;
      }
    }

    /* 2. GPU Layer 2: Letter Џ (Emerges on lit emerald screen) */
    .layer-dze {
      position: absolute;
      inset: 0;
      z-index: 2;
      will-change: transform, opacity;
      opacity: 0;
      transform: translate3d(0, 8px, 0) scale(0.92);
      animation: dzeReveal 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.65s forwards;
    }

    @keyframes dzeReveal {
      0% {
        opacity: 0;
        transform: translate3d(0, 8px, 0) scale(0.92);
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
      }
    }

    /* 3. GPU Layer 3: Pocket (In front, covers phone base with subtle reaction) */
    .layer-pocket {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      will-change: transform;
      transform: translate3d(0, 0, 0);
      animation: pocketReaction 0.95s ease-out forwards;
    }

    @keyframes pocketReaction {
      0%, 45% {
        transform: translate3d(0, 0, 0) scale(1);
      }
      70% {
        transform: translate3d(0, 1.5px, 0) scale(1.008);
      }
      100% {
        transform: translate3d(0, 0, 0) scale(1);
      }
    }

    .stage-svg {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>

  <script>
    (function() {
      var splashStartTime = Date.now();
      var MIN_SPLASH_DURATION = 2600; // Extended duration (+1 second, 2.6s hold + 0.45s fade)
      var dismissed = false;

      window.dismissDzebleSplash = function() {
        if (dismissed) return;
        dismissed = true;
        var el = document.getElementById('dzeble-splash-root');
        if (el) {
          el.classList.add('fade-out');
          setTimeout(function() {
            if (el && el.parentNode) {
              el.parentNode.removeChild(el);
            }
          }, 500);
        }
      };

      window.signalAppReady = function() {
        var elapsed = Date.now() - splashStartTime;
        var remaining = Math.max(0, MIN_SPLASH_DURATION - elapsed);
        setTimeout(function() {
          window.dismissDzebleSplash();
        }, remaining);
      };

      // Guaranteed fallback dismissal after 3.8s
      setTimeout(function() {
        window.dismissDzebleSplash();
      }, 3800);
    })();
  </script>
