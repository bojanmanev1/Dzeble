<ion-content [fullscreen]="true" class="auth-content">

  <div class="back-btn-container">
    <button class="btn-back" (click)="goBack()" type="button" aria-label="Back">
      <ion-icon name="arrow-back-outline"></ion-icon>
    </button>
  </div>

  <div class="auth-wrapper">
    <div class="auth-header">
      <div class="auth-logo-badge">
        <span class="auth-logo">🔐</span>
      </div>
      <h1>{{ 'RESET_PASSWORD.TITLE' | translate }}</h1>
      <p class="auth-subtitle">{{ 'RESET_PASSWORD.SUBTITLE' | translate }}</p>
    </div>

    <form (submit)="onUpdatePassword(); $event.preventDefault()" class="auth-form">
      <div class="input-group">
        <label>{{ 'RESET_PASSWORD.NEW_PASSWORD_LABEL' | translate }}</label>
        <div class="input-wrapper">
          <input 
            [type]="showPassword ? 'text' : 'password'" 
            [(ngModel)]="newPassword" 
            name="newPassword" 
            required 
            [placeholder]="'RESET_PASSWORD.PASSWORD_PLACEHOLDER' | translate"
            autocomplete="new-password"
          />
          <button type="button" class="btn-eye" (click)="toggleShowPassword()" aria-label="Toggle password visibility">
            <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </button>
        </div>
      </div>

      <div class="input-group">
        <label>{{ 'RESET_PASSWORD.CONFIRM_PASSWORD_LABEL' | translate }}</label>
        <div class="input-wrapper">
          <input 
            [type]="showConfirmPassword ? 'text' : 'password'" 
            [(ngModel)]="confirmPassword" 
            name="confirmPassword" 
            required 
            [placeholder]="'RESET_PASSWORD.PASSWORD_PLACEHOLDER' | translate"
            autocomplete="new-password"
          />
          <button type="button" class="btn-eye" (click)="toggleShowConfirmPassword()" aria-label="Toggle confirm password visibility">
            <ion-icon [name]="showConfirmPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </button>
        </div>
      </div>

      @if (errorMessage) {
        <div class="feedback-banner error-banner">
          <p class="error-text">{{ errorMessage }}</p>
        </div>
      }

      @if (successMessage) {
        <div class="feedback-banner success-banner">
          <ion-icon name="checkmark-circle-outline"></ion-icon>
          <p class="success-text">{{ successMessage }}</p>
        </div>
      }

      <button type="submit" class="btn-submit" [disabled]="isLoading">
        @if (isLoading) {
          <ion-spinner name="crescent"></ion-spinner>
        } @else {
          {{ 'RESET_PASSWORD.SAVE_BTN' | translate }}
        }
      </button>

      <button type="button" class="btn-toggle-mode" (click)="goBack()">
        {{ 'RESET_PASSWORD.BACK_TO_LOGIN' | translate }}
      </button>
    </form>
  </div>

  <!-- LOADER POPUP OVERLAY -->
  @if (isLoading) {
    <div class="loader-popup-backdrop">
      <div class="loader-popup-card">
        <div class="loader-spinner-wrapper">
          <ion-spinner name="crescent" class="custom-loader-spinner"></ion-spinner>
        </div>
        <h3 class="loader-popup-title">{{ 'COMMON.UPDATING' | translate }}</h3>
        <p class="loader-popup-sub">{{ 'COMMON.PLEASE_WAIT' | translate }}</p>
      </div>
    </div>
  }
</ion-content>
