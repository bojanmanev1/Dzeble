<ion-content [fullscreen]="true" class="auth-content">
  <div class="auth-wrapper">
    <div class="auth-header">
      <span class="auth-logo">🔑</span>
      <h1>Нова Лозинка</h1>
    </div>

    <form (submit)="onUpdatePassword(); $event.preventDefault()" class="auth-form">
      <div class="input-group">
        <label>Внесете нова лозинка</label>
        <input 
          type="password" 
          [(ngModel)]="newPassword" 
          name="newPassword" 
          required 
          placeholder="••••••••"
        />
      </div>

      <div class="input-group">
        <label>Потврдете ја новата лозинка</label>
        <input 
          type="password" 
          [(ngModel)]="confirmPassword" 
          name="confirmPassword" 
          required 
          placeholder="••••••••"
        />
      </div>

      @if (errorMessage) {
        <p class="error-text">{{ errorMessage }}</p>
      }

      @if (successMessage) {
        <p class="success-text">{{ successMessage }}</p>
      }

      <button type="submit" class="btn-submit" [disabled]="isLoading">
        @if (isLoading) {
          <ion-spinner name="crescent"></ion-spinner>
        } @else {
          Зачувај Лозинка
        }
      </button>
    </form>
  </div>
</ion-content>
