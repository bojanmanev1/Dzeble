name: Sync FZO Duty Pharmacies Daily

on:
  schedule:
    # Runs at 05:00 UTC daily (07:00 AM Central European / Skopje time)
    - cron: '0 5 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  sync:
    name: Sync Official FZO Duty Pharmacies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run FZO Pharmacy Sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://pvxnzqpbdizhyneiyzlf.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB2eG56cXBiZGl6aHluZWl5emxmIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4Mzg2Njk1MCwiZXhwIjoyMDk5NDQyOTUwfQ.1ysqRDZdtV0EYkt4fiDq16DSyQDZiMaO6At1QkMVIUU' }}
        run: node scripts/sync_fzo_monthly.js
